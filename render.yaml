# Fourcast on Render. Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: the-council
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ROBINHOOD_NETWORK
        value: mainnet
      - key: NEXT_PUBLIC_ROBINHOOD_NETWORK
        value: mainnet
      # Each agent starts with $20 of the house's USDG.
      - key: NEXT_PUBLIC_START_CASH
        value: "20"
      # The app's ID at Privy. It is public, and Privy only accepts it from the domains allowed in its dashboard.
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        value: cmunw1gi200070ci7nk8wqqpf
      - key: FAUCET_ENABLED
        value: "false"
      # No rewards are paid on mainnet.
      - key: DAILY_CLAIM_CAP
        value: "0"
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLAIM_SECRET
        sync: false
      - key: TREASURY_PRIVATE_KEY
        sync: false
      - key: USDG_ADDRESS
        sync: false
      - key: DESK_QUANT
        sync: false
      - key: DESK_DEGEN
        sync: false
      - key: DESK_GUARDIAN
        sync: false
      - key: DESK_ORACLE
        sync: false
      - key: DESK_SHARES
        sync: false
      - key: DESK_FROM_BLOCK
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
